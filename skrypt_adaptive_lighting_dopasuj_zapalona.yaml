# ═══════════════════════════════════════════════════════════════
# Oświetlenie adaptacyjne – dopasuj zapaloną żarówkę
# HA: script.oswietlenie_adaptacyjne_dopasuj_zapalona
# ═══════════════════════════════════════════════════════════════
#
# Elementy systemu (każdy w osobnym pliku):
#   automatyzacja_adaptive_lighting_wielopokojowa.yaml              – sterowanie
#   automatyzacja_adaptive_lighting_wykrywanie_recznych_zmian.yaml  – pauza po ręcznej zmianie
#   skrypt_adaptive_lighting_dopasuj_wszystkie.yaml                 – dopasowanie wszystkich żarówek
#   skrypt_adaptive_lighting_dopasuj_zapalona.yaml                  – dopasowanie właśnie zapalonej żarówki
#   automatyzacja_adaptive_lighting_cykliczne.yaml                  – sterowanie cykliczne (co 5 min, zmiana celu)
#   sensor_zadana_jasnosc.jinja, sensor_zadana_temperatura.jinja    – zadane wartości (pomocnicy template)
#
# Lista żarówek (bulbs) jest w trzech automatyzacjach – musi być zgodna.
#   entity – encja światła          switch – input_select pokoju (on/off/paused)
#   z2m    – friendly_name w Z2M    dumb   – żarówka pod zwykłym (niesmart) wyłącznikiem
#
# Wywoływany przez 'sterowanie' po zapaleniu żarówki (zmiana stanu albo
# device_announce z Z2M po podaniu zasilania) z parametrami bulb i force_on.
#
# Żarówkom na zwykłych wyłącznikach skrypt zapisuje ustawienia startowe:
#   zapalona przed progiem – 'jak ostatnio' (previous): krzywa rośnie albo stoi,
#     więc po ponownym włączeniu żarówka startuje z ostatnią zadaną barwą i jasnością;
#   zapalona od progu – minimum krzywej (2200 K, 20%): krzywa już tylko spada,
#     więc wieczorem i w nocy żarówka nie błyska jasno i zimno;
#   pokój z adaptacją wyłączoną (off) – zawsze 'jak ostatnio', bo nikt potem
#     nie podniesie jasności z minimum (błąd z 2026-11-23, Mały pokój).
# Próg: 3 h przed początkiem ściemniania, czyli przed zachodem słońca, ale nie wcześniej
# niż 20:00 (dusk_earliest z sensor_zadana_*.jinja; zmieniając go, popraw też tutaj i w
# 'sterowanie'). Do 2026-11-24 był to stały 12:00, ale wtedy żarówki przez wiele godzin
# startowały ciemno, choć krzywa dawała 100%.
# Żarówkom, które świecą w chwili progu, 'sterowanie' przestawia start na minimum.
#
# ═══════════════════════════════════════════════════════════════

alias: 'Oświetlenie adaptacyjne: dopasuj zapaloną żarówkę'
description: 'Ustawia zadaną barwę i jasność żarówce, która właśnie się zapaliła (na zwykłych wyłącznikach bezwarunkowo,
  na smart switchach tylko gdy odbiega) (po 0,5 s i ponownie po 3 s). Żarówkom na zwykłych wyłącznikach zapisuje ustawienia
  startowe: przed progiem (3 h przed początkiem ściemniania) i w pokojach z adaptacją wyłączoną ''jak ostatnio'', od progu minimum krzywej. Wywoływany przez automatyzację ''Oświetlenie adaptacyjne: sterowanie''.'
mode: parallel
max: 20
icon: mdi:lightbulb-on-outline
fields:
  bulb:
    description: Żarówka (element listy bulbs)
    required: true
  force_on:
    description: Żarówka na pewno świeci, nawet jeśli HA uważa ją za zgaszoną (po device_announce)
    default: false
sequence:
- delay:
    milliseconds: 500
- repeat:
    count: 2
    sequence:
    - if:
      - condition: template
        value_template: '{{ repeat.index > 1 }}'
      then:
      - delay:
          seconds: 3
    - variables:
        tb: '{{ states(''sensor.zadana_jasnosc_swiatla'') | int(0) }}'
        tk: '{{ states(''sensor.zadana_temperatura_swiatla'') | int(0) }}'
        k_now: '{{ state_attr(bulb.entity, ''color_temp_kelvin'') | int(-1) }}'
        b_now: '{{ state_attr(bulb.entity, ''brightness'') | int(-1) }}'
    - if:
      - condition: template
        value_template: |-
          {{ is_state(bulb.switch, 'on') and tb > 0 and tk > 0
             and (is_state(bulb.entity, 'on')
                  or (force_on and repeat.index == 1
                      and not is_state(bulb.entity, 'unavailable'))) }}
      then:
      - if:
        - condition: template
          value_template: '{{ bulb.dumb or (k_now - tk) | abs >= 30 }}'
        then:
        - action: light.turn_on
          continue_on_error: true
          target:
            entity_id: '{{ bulb.entity }}'
          data:
            color_temp_kelvin: '{{ tk }}'
            transition: 0
        - delay:
            milliseconds: 150
      - if:
        - condition: template
          value_template: '{{ bulb.dumb or (b_now - (tb * 2.55) | round(0)) | abs >= 3 }}'
        then:
        - action: light.turn_on
          continue_on_error: true
          target:
            entity_id: '{{ bulb.entity }}'
          data:
            brightness_pct: '{{ tb }}'
            transition: 0.5
- if:
  - condition: template
    value_template: '{{ bulb.dumb }}'
  then:
  - delay:
      milliseconds: 1500
  - action: mqtt.publish
    continue_on_error: true
    data:
      topic: zigbee2mqtt/{{ bulb.z2m }}/set
      payload: |-
        {% set ns = state_attr('sun.sun', 'next_setting') %}
        {% set ns = as_datetime(ns) | as_local if ns else today_at('20:00') %}
        {% set ss = ns if ns.date() == now().date() else ns - timedelta(days=1) %}
        {% set prog = [ss, today_at('20:00')] | max - timedelta(hours=3) %}
        {% if now() < prog or is_state(bulb.switch, 'off') %}
          {"color_temp_startup": "previous", "level_config": {"current_level_startup": "previous"}}
        {% else %}
          {"color_temp_startup": 454, "level_config": {"current_level_startup": 51}}
        {% endif %}
