# ═══════════════════════════════════════════════════════════════
# Oświetlenie adaptacyjne – sterowanie
# HA: automation.oswietlenie_adaptive_lighting_wielopokojowe (id 1780307109863)
# ═══════════════════════════════════════════════════════════════
#
# Elementy systemu (każdy w osobnym pliku):
#   automatyzacja_adaptive_lighting_wielopokojowa.yaml              – sterowanie
#   automatyzacja_adaptive_lighting_wykrywanie_recznych_zmian.yaml  – pauza po ręcznej zmianie
#   skrypt_adaptive_lighting_uzgodnij.yaml                          – dopasowanie wszystkich żarówek
#   skrypt_adaptive_lighting_swieza_zarowka.yaml                    – dopasowanie świeżo zapalonej żarówki
#   sensor_zadana_jasnosc.jinja, sensor_zadana_temperatura.jinja    – zadane wartości (pomocnicy template)
#
# Lista żarówek (bulbs) jest w obu automatyzacjach – musi być zgodna.
#   entity – encja światła          switch – input_select pokoju (on/off/paused)
#   z2m    – friendly_name w Z2M    dumb   – żarówka pod zwykłym (niesmart) wyłącznikiem
#
# Jak dodać żarówkę:
#   1. Dopisz ją do bulbs tutaj i w automatyzacji 'wykrywanie ręcznych zmian'
#   2. Dopisz jej encję do triggerów 'fresh' i 'off' poniżej
#   Nowy pokój: dodatkowo input_select.oswietlenie_adaptacyjne_NAZWA
#   (opcje: on / off / paused) w triggerze 'mode'
#
# Stany przełącznika pokoju:
#   on     – adaptacja aktywna
#   off    – adaptacja wyłączona
#   paused – wstrzymana (ręczna zmiana); zdejmuje ją zgaszenie wszystkich
#            świateł w pokoju albo użycie fizycznego wyłącznika
#
# Żarówki na zwykłych wyłącznikach zawsze startują 'jak ostatnio' (ustawia to
# skrypt 'świeżo zapalona żarówka'), czyli z ostatnią zadaną barwą i jasnością.
#
# ═══════════════════════════════════════════════════════════════

alias: 'Oświetlenie adaptacyjne: sterowanie'
description: Steruje oświetleniem adaptacyjnym. Każdy pokój ma input_select (on/off/paused). Zmiana zadanych wartości,
  kontrola co 5 min i start HA uruchamiają skrypt 'uzgodnij'. Zapalenie żarówki (zmiana stanu lub device_announce
  z Z2M po podaniu zasilania) uruchamia skrypt 'świeżo zapalona żarówka'. Pauzę (ustawianą przez automatyzację 'wykrywanie
  ręcznych zmian') zdejmuje zgaszenie wszystkich świateł w pokoju albo użycie fizycznego wyłącznika. Lista żarówek
  (bulbs) musi być zgodna z listą w automatyzacji 'wykrywanie ręcznych zmian'.
triggers:
- trigger: state
  entity_id:
  - sensor.zadana_jasnosc_swiatla
  - sensor.zadana_temperatura_swiatla
  id: target
- trigger: time_pattern
  minutes: /5
  id: reconcile
- trigger: homeassistant
  event: start
  id: start
- trigger: state
  entity_id:
  - input_select.oswietlenie_adaptacyjne_korytarz
  - input_select.oswietlenie_adaptacyjne_kuchnia
  - input_select.oswietlenie_adaptacyjne_lazienka
  - input_select.oswietlenie_adaptacyjne_maly_pokoj
  - input_select.oswietlenie_adaptacyjne_salon
  - input_select.oswietlenie_adaptacyjne_sypialnia
  to: null
  id: mode
- trigger: state
  entity_id:
  - light.sypialnia
  - light.salon_kanapa_stol
  - light.salon_kanapa_srodek
  - light.salon_kanapa_sciana
  - light.salon_srodek_okno
  - light.salon_srodek_wejscie
  - light.lazienka
  - light.korytarz
  - light.maly_pokoj
  - light.kuchnia_wejscie
  from:
  - 'off'
  - unavailable
  to: 'on'
  id: fresh
- trigger: mqtt
  topic: zigbee2mqtt/bridge/event
  value_template: '{{ value_json.type }}'
  payload: device_announce
  id: announce
- trigger: state
  entity_id:
  - light.sypialnia
  - light.salon_kanapa_stol
  - light.salon_kanapa_srodek
  - light.salon_kanapa_sciana
  - light.salon_srodek_okno
  - light.salon_srodek_wejscie
  - light.lazienka
  - light.korytarz
  - light.maly_pokoj
  - light.kuchnia_wejscie
  from: 'on'
  to:
  - 'off'
  - unavailable
  id: 'off'
actions:
- choose:
  - conditions:
    - condition: trigger
      id:
      - target
      - reconcile
      - start
    sequence:
    - if:
      - condition: trigger
        id: start
      then:
      - delay:
          seconds: 30
    - action: script.turn_on
      target:
        entity_id: script.oswietlenie_adaptacyjne_uzgodnij
      data:
        variables:
          bulbs: '{{ bulbs }}'
  - conditions:
    - condition: trigger
      id: mode
    sequence:
    - variables:
        new: '{{ trigger.to_state.state if trigger.to_state else '''' }}'
        room_bulbs: '{{ bulbs | selectattr(''switch'', ''eq'', trigger.entity_id) | list }}'
    - if:
      - condition: template
        value_template: '{{ new == ''off'' }}'
      then:
      - repeat:
          for_each: '{{ room_bulbs | rejectattr(''dumb'') | rejectattr(''entity'', ''is_state'', ''unavailable'')
            | list }}'
          sequence:
          - action: mqtt.publish
            continue_on_error: true
            data:
              topic: zigbee2mqtt/{{ repeat.item.z2m }}/set
              payload: '{"level_config": {"on_level": "previous"}}'
          - delay:
              milliseconds: 150
    - if:
      - condition: template
        value_template: '{{ new == ''on'' }}'
      then:
      - action: script.turn_on
        target:
          entity_id: script.oswietlenie_adaptacyjne_uzgodnij
        data:
          variables:
            bulbs: '{{ bulbs }}'
  - conditions:
    - condition: trigger
      id:
      - fresh
      - announce
    sequence:
    - variables:
        bulb: |-
          {% if trigger.id == 'announce' %}
            {% set m = bulbs | selectattr('z2m', 'eq', trigger.payload_json.data.friendly_name | default('')) | list %}
          {% else %}
            {% set m = bulbs | selectattr('entity', 'eq', trigger.entity_id) | list %}
          {% endif %}
          {{ m[0] if m else none }}
    - condition: template
      value_template: '{{ bulb is mapping }}'
    - condition: template
      value_template: |-
        {{ trigger.id != 'announce'
           or (not is_state(bulb.entity, 'unavailable')
               and (not is_state(bulb.entity, 'on')
                    or (now() - states[bulb.entity].last_changed).total_seconds() > 5)) }}
    - variables:
        physical: |-
          {{ trigger.id == 'announce'
             or (trigger.to_state.context.user_id is none
                 and trigger.to_state.context.parent_id is none) }}
    - if:
      - condition: template
        value_template: '{{ physical and is_state(bulb.switch, ''paused'') }}'
      then:
      - action: input_select.select_option
        target:
          entity_id: '{{ bulb.switch }}'
        data:
          option: 'on'
    - action: script.turn_on
      target:
        entity_id: script.oswietlenie_adaptacyjne_swieza_zarowka
      data:
        variables:
          bulb: '{{ bulb }}'
          force_on: '{{ trigger.id == ''announce'' }}'
  - conditions:
    - condition: trigger
      id: 'off'
    sequence:
    - delay:
        seconds: 3
    - variables:
        bulb: |-
          {% if trigger.id == 'announce' %}
            {% set m = bulbs | selectattr('z2m', 'eq', trigger.payload_json.data.friendly_name | default('')) | list %}
          {% else %}
            {% set m = bulbs | selectattr('entity', 'eq', trigger.entity_id) | list %}
          {% endif %}
          {{ m[0] if m else none }}
    - condition: template
      value_template: |-
        {{ bulb is mapping and is_state(bulb.switch, 'paused')
           and bulbs | selectattr('switch', 'eq', bulb.switch)
                     | map(attribute='entity') | select('is_state', 'on')
                     | list | count == 0 }}
    - action: input_select.select_option
      target:
        entity_id: '{{ bulb.switch }}'
      data:
        option: 'on'
mode: parallel
max: 30
variables:
  bulbs:
  - entity: light.sypialnia
    z2m: sypialnia
    dumb: false
    switch: input_select.oswietlenie_adaptacyjne_sypialnia
  - entity: light.salon_kanapa_stol
    z2m: salon_kanapa_stol
    dumb: true
    switch: input_select.oswietlenie_adaptacyjne_salon
  - entity: light.salon_kanapa_srodek
    z2m: salon_kanapa_srodek
    dumb: true
    switch: input_select.oswietlenie_adaptacyjne_salon
  - entity: light.salon_kanapa_sciana
    z2m: salon_kanapa_sciana
    dumb: true
    switch: input_select.oswietlenie_adaptacyjne_salon
  - entity: light.salon_srodek_okno
    z2m: salon_srodek_okno
    dumb: false
    switch: input_select.oswietlenie_adaptacyjne_salon
  - entity: light.salon_srodek_wejscie
    z2m: salon_srodek_wejscie
    dumb: false
    switch: input_select.oswietlenie_adaptacyjne_salon
  - entity: light.lazienka
    z2m: lazienka
    dumb: true
    switch: input_select.oswietlenie_adaptacyjne_lazienka
  - entity: light.korytarz
    z2m: korytarz
    dumb: true
    switch: input_select.oswietlenie_adaptacyjne_korytarz
  - entity: light.maly_pokoj
    z2m: maly_pokoj
    dumb: true
    switch: input_select.oswietlenie_adaptacyjne_maly_pokoj
  - entity: light.kuchnia_wejscie
    z2m: kuchnia_wejscie
    dumb: true
    switch: input_select.oswietlenie_adaptacyjne_kuchnia
trace:
  stored_traces: 30
