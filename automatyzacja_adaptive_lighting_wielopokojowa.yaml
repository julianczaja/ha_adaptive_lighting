# ═══════════════════════════════════════════════════════════════
# Oświetlenie adaptacyjne – sterowanie
# HA: automation.oswietlenie_adaptive_lighting_wielopokojowe (id 1780307109863)
# ═══════════════════════════════════════════════════════════════
#
# Elementy systemu (każdy w osobnym pliku):
#   automatyzacja_adaptive_lighting_wielopokojowa.yaml              – sterowanie
#   automatyzacja_adaptive_lighting_wykrywanie_recznych_zmian.yaml  – pauza po ręcznej zmianie
#   skrypt_adaptive_lighting_dopasuj_wszystkie.yaml                 – dopasowanie wszystkich żarówek
#   skrypt_adaptive_lighting_dopasuj_zapalona.yaml                  – dopasowanie właśnie zapalonej żarówki
#   automatyzacja_adaptive_lighting_cykliczne.yaml                  – sterowanie cykliczne (co 5 min, zmiana celu)
#   sensor_zadana_jasnosc.jinja, sensor_zadana_temperatura.jinja    – zadane wartości (pomocnicy template)
#
# Lista żarówek (bulbs) jest w trzech automatyzacjach – musi być zgodna.
#   entity – encja światła          switch – input_select pokoju (on/off/paused)
#   z2m    – friendly_name w Z2M    dumb   – żarówka pod zwykłym (niesmart) wyłącznikiem
#
# Jak dodać żarówkę:
#   1. Dopisz ją do bulbs tutaj, w 'sterowaniu cyklicznym' i w 'wykrywaniu ręcznych zmian'
#   2. Dopisz jej encję do triggerów 'fresh' i 'off' poniżej
#   Nowy pokój: dodatkowo input_select.oswietlenie_adaptacyjne_NAZWA
#   (opcje: on / off / paused) w triggerze 'mode'
#
# Stany przełącznika pokoju:
#   on     – adaptacja aktywna
#   off    – adaptacja wyłączona
#   paused – wstrzymana (ręczna zmiana); zdejmuje ją zgaszenie wszystkich
#            świateł w pokoju (od razu przez użytkownika, po 3 s przez
#            automatyzację lub scenę) albo użycie fizycznego wyłącznika
#
# Żarówki na zwykłych wyłącznikach startują 'jak ostatnio', jeśli zapalono je
# przed 12:00, a od 12:00 z minimum krzywej (ustawia to skrypt 'dopasuj zapaloną
# żarówkę'; świecącym w południe trigger 'noon').
#
# Pełne światło: input_boolean.oswietlenie_pelne_swiatlo (trigger 'full').
#   on  – migawka trybów pokoi i każdej zapalonej żarówki (scene.create),
#         pokoje 'on' → 'paused', zapalone żarówki 100% / 4000 K; zgaszonych nie
#         zapala, ale żarówka zapalona w tym czasie też dostaje pełne światło
#   off – przywraca tryby pokoi (pokoje 'on' same się dopasują), a w pokojach
#         wstrzymanych i wyłączonych przywraca zapalonym żarówkom stan z migawki.
#         Po restarcie HA migawek nie ma: wtedy tylko zdejmuje pauzy.
#
# ═══════════════════════════════════════════════════════════════

alias: 'Oświetlenie adaptacyjne: sterowanie'
description: Steruje oświetleniem adaptacyjnym przy zdarzeniach. Każdy pokój ma input_select (on/off/paused). Zapalenie
  żarówki (zmiana stanu lub device_announce z Z2M po podaniu zasilania) uruchamia skrypt 'dopasuj zapaloną żarówkę'.
  Pauzę (ustawianą przez automatyzację 'wykrywanie ręcznych zmian') zdejmuje zgaszenie wszystkich świateł w pokoju
  albo użycie fizycznego wyłącznika. O 12:00 przestawia start świecących żarówek na zwykłych wyłącznikach na minimum
  krzywej. Obsługuje też przełącznik pełnego światła (zapalone i zapalane potem żarówki dostają 100% i 4000 K, wyłączenie
  przywraca poprzedni stan). Okresowe dopasowanie jest w 'sterowaniu cyklicznym'. Lista żarówek (bulbs) musi być
  zgodna z listami w 'sterowaniu cyklicznym' i 'wykrywaniu ręcznych zmian'.
triggers:
- trigger: state
  entity_id:
  - input_select.oswietlenie_adaptacyjne_korytarz
  - input_select.oswietlenie_adaptacyjne_kuchnia
  - input_select.oswietlenie_adaptacyjne_lazienka
  - input_select.oswietlenie_adaptacyjne_maly_pokoj
  - input_select.oswietlenie_adaptacyjne_salon
  - input_select.oswietlenie_adaptacyjne_sypialnia
  to: null
  id: mode
- trigger: state
  entity_id:
  - light.sypialnia
  - light.salon_kanapa_stol
  - light.salon_kanapa_srodek
  - light.salon_kanapa_sciana
  - light.salon_srodek_okno
  - light.salon_srodek_wejscie
  - light.lazienka
  - light.korytarz
  - light.maly_pokoj
  - light.kuchnia_wejscie
  from:
  - 'off'
  - unavailable
  to: 'on'
  id: fresh
- trigger: mqtt
  topic: zigbee2mqtt/bridge/event
  value_template: '{{ value_json.type }}'
  payload: device_announce
  id: announce
- trigger: state
  entity_id:
  - light.sypialnia
  - light.salon_kanapa_stol
  - light.salon_kanapa_srodek
  - light.salon_kanapa_sciana
  - light.salon_srodek_okno
  - light.salon_srodek_wejscie
  - light.lazienka
  - light.korytarz
  - light.maly_pokoj
  - light.kuchnia_wejscie
  from: 'on'
  to:
  - 'off'
  - unavailable
  id: 'off'
- trigger: time
  at: '12:00:00'
  id: noon
- trigger: state
  entity_id: input_boolean.oswietlenie_pelne_swiatlo
  from:
  - 'on'
  - 'off'
  to:
  - 'on'
  - 'off'
  id: full
actions:
- choose:
  - conditions:
    - condition: trigger
      id: mode
    sequence:
    - variables:
        new: '{{ trigger.to_state.state if trigger.to_state else '''' }}'
        room_bulbs: '{{ bulbs | selectattr(''switch'', ''eq'', trigger.entity_id) | list }}'
    - if:
      - condition: template
        value_template: '{{ new == ''off'' }}'
      then:
      - repeat:
          for_each: '{{ room_bulbs | rejectattr(''dumb'') | rejectattr(''entity'', ''is_state'', ''unavailable'')
            | list }}'
          sequence:
          - action: mqtt.publish
            continue_on_error: true
            data:
              topic: zigbee2mqtt/{{ repeat.item.z2m }}/set
              payload: '{"level_config": {"on_level": "previous"}}'
          - delay:
              milliseconds: 150
    - if:
      - condition: template
        value_template: '{{ new == ''on'' }}'
      then:
      - action: script.turn_on
        target:
          entity_id: script.oswietlenie_adaptacyjne_dopasuj_wszystkie
        data:
          variables:
            bulbs: '{{ bulbs }}'
  - conditions:
    - condition: trigger
      id:
      - fresh
      - announce
    sequence:
    - variables:
        bulb: |-
          {% if trigger.id == 'announce' %}
            {% set m = bulbs | selectattr('z2m', 'eq', trigger.payload_json.data.friendly_name | default('')) | list %}
          {% else %}
            {% set m = bulbs | selectattr('entity', 'eq', trigger.entity_id) | list %}
          {% endif %}
          {{ m[0] if m else none }}
    - condition: template
      value_template: '{{ bulb is mapping }}'
    - condition: template
      value_template: |-
        {{ trigger.id != 'announce'
           or (not is_state(bulb.entity, 'unavailable')
               and (not is_state(bulb.entity, 'on')
                    or (now() - states[bulb.entity].last_changed).total_seconds() > 5)) }}
    - if:
      - condition: template
        value_template: '{{ is_state(''input_boolean.oswietlenie_pelne_swiatlo'', ''on'') and (trigger.id == ''fresh''
          or bulb.dumb) }}'
      then:
      - action: light.turn_on
        continue_on_error: true
        target:
          entity_id: '{{ bulb.entity }}'
        data:
          color_temp_kelvin: 4000
          transition: 0
      - delay:
          milliseconds: 150
      - action: light.turn_on
        continue_on_error: true
        target:
          entity_id: '{{ bulb.entity }}'
        data:
          brightness_pct: 100
          transition: 0.5
      - stop: Pełne światło
    - variables:
        physical: |-
          {{ trigger.id == 'announce'
             or (trigger.to_state.context.user_id is none
                 and trigger.to_state.context.parent_id is none) }}
    - if:
      - condition: template
        value_template: '{{ physical and is_state(bulb.switch, ''paused'') }}'
      then:
      - action: input_select.select_option
        target:
          entity_id: '{{ bulb.switch }}'
        data:
          option: 'on'
    - action: script.turn_on
      target:
        entity_id: script.oswietlenie_adaptacyjne_dopasuj_zapalona
      data:
        variables:
          bulb: '{{ bulb }}'
          force_on: '{{ trigger.id == ''announce'' and bulb.dumb }}'
  - conditions:
    - condition: trigger
      id: 'off'
    sequence:
    - variables:
        bulb: |-
          {% if trigger.id == 'announce' %}
            {% set m = bulbs | selectattr('z2m', 'eq', trigger.payload_json.data.friendly_name | default('')) | list %}
          {% else %}
            {% set m = bulbs | selectattr('entity', 'eq', trigger.entity_id) | list %}
          {% endif %}
          {{ m[0] if m else none }}
        direct: '{{ trigger.to_state.context.parent_id is none }}'
    - if:
      - condition: template
        value_template: '{{ not direct }}'
      then:
      - delay:
          seconds: 3
    - condition: template
      value_template: |-
        {{ bulb is mapping and is_state(bulb.switch, 'paused')
           and not is_state('input_boolean.oswietlenie_pelne_swiatlo', 'on')
           and bulbs | selectattr('switch', 'eq', bulb.switch)
                     | map(attribute='entity') | select('is_state', 'on')
                     | list | count == 0 }}
    - action: input_select.select_option
      target:
        entity_id: '{{ bulb.switch }}'
      data:
        option: 'on'
  - conditions:
    - condition: trigger
      id: noon
    sequence:
    - repeat:
        for_each: '{{ bulbs | selectattr(''dumb'') | selectattr(''entity'', ''is_state'', ''on'') | list }}'
        sequence:
        - action: mqtt.publish
          continue_on_error: true
          data:
            topic: zigbee2mqtt/{{ repeat.item.z2m }}/set
            payload: '{"color_temp_startup": 454, "level_config": {"current_level_startup": 51}}'
        - delay:
            milliseconds: 150
  - conditions:
    - condition: trigger
      id: full
    sequence:
    - variables:
        lit: '{{ bulbs | selectattr(''entity'', ''is_state'', ''on'') | list }}'
        switches: '{{ bulbs | map(attribute=''switch'') | unique | list }}'
        old_scenes: '{{ states.scene | map(attribute=''entity_id'') | select(''match'', ''scene.oswietlenie_przed_pelnym_'')
          | list }}'
    - if:
      - condition: template
        value_template: '{{ trigger.to_state.state == ''on'' }}'
      then:
      - if:
        - condition: template
          value_template: '{{ old_scenes | count > 0 }}'
        then:
        - action: scene.delete
          continue_on_error: true
          target:
            entity_id: '{{ old_scenes }}'
      - action: scene.create
        data:
          scene_id: oswietlenie_tryby_przed_pelnym_swiatlem
          snapshot_entities: '{{ switches }}'
      - repeat:
          for_each: '{{ lit }}'
          sequence:
          - action: scene.create
            data:
              scene_id: oswietlenie_przed_pelnym_{{ repeat.item.z2m }}
              snapshot_entities:
              - '{{ repeat.item.entity }}'
      - if:
        - condition: template
          value_template: '{{ switches | select(''is_state'', ''on'') | list | count > 0 }}'
        then:
        - action: input_select.select_option
          target:
            entity_id: '{{ switches | select(''is_state'', ''on'') | list }}'
          data:
            option: paused
        - delay:
            milliseconds: 300
      - condition: template
        value_template: '{{ lit | count > 0 }}'
      - action: light.turn_on
        continue_on_error: true
        target:
          entity_id: '{{ lit | map(attribute=''entity'') | list }}'
        data:
          color_temp_kelvin: 4000
          transition: 0
      - delay:
          milliseconds: 300
      - action: light.turn_on
        continue_on_error: true
        target:
          entity_id: '{{ lit | map(attribute=''entity'') | list }}'
        data:
          brightness_pct: 100
          transition: 0.5
      else:
      - if:
        - condition: template
          value_template: '{{ ''scene.oswietlenie_tryby_przed_pelnym_swiatlem'' in states.scene | map(attribute=''entity_id'')
            | list }}'
        then:
        - action: scene.turn_on
          continue_on_error: true
          target:
            entity_id: scene.oswietlenie_tryby_przed_pelnym_swiatlem
        - delay:
            milliseconds: 500
        - variables:
            restore: '{% set ns = namespace(e=[]) %}{% for b in bulbs if is_state(b.entity, ''on'') and not is_state(b.switch,
              ''on'') and (''scene.oswietlenie_przed_pelnym_'' ~ b.z2m) in old_scenes %}{% set ns.e = ns.e + [''scene.oswietlenie_przed_pelnym_''
              ~ b.z2m] %}{% endfor %}{{ ns.e }}'
        - if:
          - condition: template
            value_template: '{{ restore | count > 0 }}'
          then:
          - action: scene.turn_on
            continue_on_error: true
            target:
              entity_id: '{{ restore }}'
        - action: scene.delete
          continue_on_error: true
          target:
            entity_id: '{{ old_scenes + [''scene.oswietlenie_tryby_przed_pelnym_swiatlem''] }}'
        else:
        - if:
          - condition: template
            value_template: '{{ switches | select(''is_state'', ''paused'') | list | count > 0 }}'
          then:
          - action: input_select.select_option
            target:
              entity_id: '{{ switches | select(''is_state'', ''paused'') | list }}'
            data:
              option: 'on'
mode: parallel
max: 30
variables:
  bulbs:
  - entity: light.sypialnia
    z2m: sypialnia
    dumb: false
    switch: input_select.oswietlenie_adaptacyjne_sypialnia
  - entity: light.salon_kanapa_stol
    z2m: salon_kanapa_stol
    dumb: true
    switch: input_select.oswietlenie_adaptacyjne_salon
  - entity: light.salon_kanapa_srodek
    z2m: salon_kanapa_srodek
    dumb: true
    switch: input_select.oswietlenie_adaptacyjne_salon
  - entity: light.salon_kanapa_sciana
    z2m: salon_kanapa_sciana
    dumb: true
    switch: input_select.oswietlenie_adaptacyjne_salon
  - entity: light.salon_srodek_okno
    z2m: salon_srodek_okno
    dumb: false
    switch: input_select.oswietlenie_adaptacyjne_salon
  - entity: light.salon_srodek_wejscie
    z2m: salon_srodek_wejscie
    dumb: false
    switch: input_select.oswietlenie_adaptacyjne_salon
  - entity: light.lazienka
    z2m: lazienka
    dumb: true
    switch: input_select.oswietlenie_adaptacyjne_lazienka
  - entity: light.korytarz
    z2m: korytarz
    dumb: true
    switch: input_select.oswietlenie_adaptacyjne_korytarz
  - entity: light.maly_pokoj
    z2m: maly_pokoj
    dumb: true
    switch: input_select.oswietlenie_adaptacyjne_maly_pokoj
  - entity: light.kuchnia_wejscie
    z2m: kuchnia_wejscie
    dumb: true
    switch: input_select.oswietlenie_adaptacyjne_kuchnia
trace:
  stored_traces: 100
